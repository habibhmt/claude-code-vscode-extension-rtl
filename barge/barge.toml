# ساخته با abzar/barge_saz.py — «مقدار فعلی در برگه» ی کارتِ هاور؛ دستی عوض نکن
# هر خط: NAME = مقدار   # از <فایل>:<خط> — مقدار از خودِ کد خوانده شده، نه از حافظه

[provider]
# تعریف ۳۵ — پرووایدرِ پیش‌فرضِ هر هارنس، از پیکربندیِ خودش (بی کلید و توکن)
# دلیلِ انتخابِ راهِ «ب»: مقدارِ provider در کدِ این مخزن متغیر نیست (فیلدِ داده است)،
# پس ساختنِ متغیرِ قلابی در دروازه فقط برای برگه، حقیقت را جعل می‌کرد.
provider_harness_cli_claude_code = "opencode (دروازهٔ محلی)"   # از ~/.claude/claude_env.sh (ANTHROPIC_BASE_URL="http://127.0.0.1:50990")
provider_harness_cli_opencode = "openrouter"   # از ~/.local/bin/opencode (export OPENROUTER_API_KEY="$KEY")
provider_harness_cli_codex = "openai"   # از ~/.codex/config.toml (model = "gpt-6.2-astra")
provider_harness_cli_dsh = "deepseek (پیش‌فرض)"   # از ~/.dsh/.env (OPENROUTER_API_KEY)
provider_harness_cli_ori = "openrouter"   # از ~/.ori/config.json ("loginMode": "oauth",)
provider_harness_cli_hermes = "anthropic"   # از ~/.hermes/config.yaml (provider: anthropic)
provider_harness_cli_cursor_agent = "openai"   # از ~/.cursor/cli-config.json ("modelId": "gpt-5",)

